name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          command_timeout: 10m
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin
            cd /www/wwwroot/backend
            
            # Reset and pull latest code
            git reset --hard origin/main
            git pull origin main
            
            # Production dependencies install (Fast & Lightweight)
            npm install --production --no-audit --no-fund
            
            # Restart Node server cleanly
            nohup pkill -f "node /www/wwwroot/backend/server.js" > /dev/null 2>&1 &
            sleep 2
            
            echo "Backend successfully deployed!"