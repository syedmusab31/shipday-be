name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          command_timeout: 10m
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin
            cd /www/wwwroot/backend
            
            # Reset local changes and pull latest code
            git reset --hard origin/main
            git pull origin main
            
            # Install dependencies without running post-install scripts
            npm install --omit=dev --no-audit --no-fund --ignore-scripts
            
            # Safe process restart using detached subshell
            (pkill -f "server.js" || true) < /dev/null > /dev/null 2>&1 &
            
            echo "Backend code pulled and restart command dispatched successfully!"
